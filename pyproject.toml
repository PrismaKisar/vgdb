[project]
name = "vgdb"
version = "0.1.0"
description = "Archivio personale dei videogiochi giocati"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pillow>=12.3.0",
]

[project.scripts]
vgdb = "vgdb.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vgdb"]

[tool.setuptools.package-data]
vgdb = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
